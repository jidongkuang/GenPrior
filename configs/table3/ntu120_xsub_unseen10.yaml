# Experiment setup
seed: 1

# Output
output_dir: outputs/table3/ntu120_xsub_unseen10

# Dataset
split_name: ntu120_xsub_seen110_unseen10

# Skeleton encoder
num_seen_classes: 110
num_point: 25
num_person: 2
graph: genprior.graph.ntu_rgb_d.Graph
graph_args:
  labeling_mode: spatial

# Cross-modal VAE alignment
skeleton_feature_dim: 256
latent_dim: 768
text_feature_dim: 1536
distribution_alignment_weight: 0.1

# Generation-Enhanced Semantic Features
use_generated_motion_prior: true
use_dispersion_gate: true
dispersion_gate_mode: full
prior_fusion_weight: 1.0
generated_motion_path: data/generated_motions.pkl
skeleton_encoder_checkpoint: checkpoints/skeleton_encoder.pt

# Text encoder
text_encoder_name_or_path: openai/clip-vit-large-patch14-336
clip_backend: hf

# Optimization
lr: 1.0e-4
weight_decay: 0.01

# Training
training_steps: 1000
train_batch_size: 64
eval_batch_size: 64
log_interval: 10
eval_interval: 10

# Generative Prototype Refinement
use_gpr: true
gpr_support_ratio: 0.4
prediction_space: fused
second_refinement_round: false
diagnostic_heads: false

# Feeder
feeder: genprior.data.ntu.Feeder
feature_path: skeleton_features/synse_features/ntu120_seen110_unseen10.npz
num_workers: 32

# Semantic data
semantic_dir: semantics
max_text_length: 75
semantic_neighbor_count: 1
semantic_neighbor_weights: [0.3, 0.3]

# GZSL
calibration_factor: 0.85
setting: GZSL
