# Experiment setup
seed: 1

# Output
output_dir: outputs/table2/pku51_xsub_unseen5_split2

# dataset
split_name: pku51_xsub_seen46_unseen5_sa_dvae_split2

# Skeleton encoder
num_seen_classes: 46
num_point: 25
num_person: 2
graph: genprior.graph.ntu_rgb_d.Graph
graph_args:
  labeling_mode: 'spatial'

# Cross-modal VAE alignment
skeleton_feature_dim: 256
latent_dim: 768
text_feature_dim: 1536
distribution_alignment_weight: 0.1

# Generated-motion prior (disabled for this protocol)
use_generated_motion_prior: false
use_dispersion_gate: false
dispersion_gate_mode: full
prior_fusion_weight: 0.0

# Text encoder
text_encoder_name_or_path: openai/clip-vit-large-patch14-336
clip_backend: hf

# optimization
lr: 1.0e-4
weight_decay: 0.01

# Training
training_steps: 1000
train_batch_size: 64
eval_batch_size: 64
log_interval: 10
eval_interval: 10

# Generative Prototype Refinement (GPR)
use_gpr: true
gpr_support_ratio: 0.4
prediction_space: latent
diagnostic_heads: false

# feeder
feeder: genprior.data.pku.Feeder
feature_path: skeleton_features/sa_dvae_features/pku51_seen46_unseen5_split2.npz
num_workers: 32

# semantics data path
semantic_dir: semantics
max_text_length: 70
semantic_neighbor_count: 3
semantic_neighbor_weights: [0.2, 0.4]

# GZSL
calibration_factor: 0.5

setting: ZSL
